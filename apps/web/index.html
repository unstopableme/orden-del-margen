<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orden del Margen | Community</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/">
          <span class="brand-mark">OM</span>
          <span>Orden del Margen</span>
        </a>
        <div>
          <span class="environment" id="auth-status">Signed out</span>
          <button class="secondary" id="passport-login">Sign in with Immutable</button>
          <button class="secondary" id="passport-logout" hidden>Logout</button>
        </div>
      </header>

      <main id="app" aria-live="polite">
        <div class="loading">Loading your community dashboard...</div>
      </main>
    </div>
    <script type="module">
      const demoMode = import.meta.env.VITE_COMMUNITY_DEMO_MODE === 'true';
      const apiBaseUrl = (import.meta.env.VITE_API_BASE_URL || 'http://localhost:3000').replace(/\/$/, '');
      let communityFetch;
      let passportInstance;

      function authorizedHeaders(includeJson = false) {
        const headers = {};
        if (includeJson) headers['Content-Type'] = 'application/json';
        return headers;
      }

      if (demoMode) {
        communityFetch = (path, options = {}) => {
          const headers = new Headers(options.headers);
          headers.set('Authorization', 'Bearer demo-member-1-token');
          return fetch(`${apiBaseUrl}${path}`, { ...options, headers });
        };
      } else {
        const passport = await import('./src/passport.js');
        communityFetch = passport.passportFetch;
        passportInstance = passport.passportInstance;
        await passport.completePassportRedirect();
        document.querySelector('#passport-login').addEventListener('click', async () => {
          await passport.signIn();
          window.location.reload();
        });
        document.querySelector('#passport-logout').addEventListener('click', () => passport.signOut());
      }

      document.querySelector('#passport-login').hidden = demoMode;
      document.querySelector('#passport-logout').hidden = demoMode;
      document.querySelector('#auth-status').textContent = demoMode ? 'Demo mode' : 'Signed out';

      function escapeHtml(value) {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      function renderDashboard(dashboard) {
        const {
          member,
          announcements,
          properties,
          referrals,
          progressionEvents,
          quests,
          coffeeGifts,
          knowledgeLeaderboard
        } =
          dashboard;
        const joinedReferrals = referrals.filter(
          (referral) => referral.status === 'joined'
        ).length;

        document.querySelector('#app').innerHTML = `
          <section class="hero">
            <div>
              <p class="eyebrow">Your neighborhood network</p>
              <h1>Good to see you, ${escapeHtml(member.displayName)}.</h1>
              <p class="muted">${escapeHtml(member.bio)}</p>
              <div class="topics">${member.topics.map((topic) => `<span>${escapeHtml(topic)}</span>`).join('')}</div>
            </div>
            <div class="level-card">
              <span>Level ${member.level}</span>
              <strong>${member.points} pts</strong>
              <div class="progress"><span style="width: ${member.progressToNextLevel}%"></span></div>
              <small>${member.nextLevelAt - member.points} points to the next level</small>
            </div>
          </section>

          <section class="grid metrics">
            <article class="card status-card">
              <div class="card-heading"><span class="icon">✦</span><span>Member status</span></div>
              <p class="status">${escapeHtml(member.status)}</p>
              <button class="secondary" id="change-status">Update status</button>
            </article>
            <article class="card">
              <div class="card-heading"><span class="icon">↗</span><span>Referrals</span></div>
              <strong class="metric">${joinedReferrals}/${referrals.length}</strong>
              <p class="muted">Neighbors have joined from your invites.</p>
              <button class="secondary" id="invite-neighbor">Invite a neighbor</button>
            </article>
            <article class="card">
              <div class="card-heading"><span class="icon">◆</span><span>Badges</span></div>
              <div class="badges">${member.badges.map((badge) => `<span>${escapeHtml(badge)}</span>`).join('')}</div>
              <p class="muted">Earn recognition through helpful community actions.</p>
            </article>
          </section>

          <section class="content-grid">
            <article class="card">
              <div class="section-heading">
                <div><p class="eyebrow">Stay connected</p><h2>Community updates</h2></div>
                <span class="count">${announcements.length}</span>
              </div>
              <div class="updates">${announcements.map((item) => `
                <div class="update">
                  <div class="update-dot"></div>
                  <div><h3>${escapeHtml(item.title)}</h3><p>${escapeHtml(item.body)}</p><small>By ${escapeHtml(item.author)}</small></div>
                </div>`).join('')}</div>
            </article>
            <article class="card">
              <div class="section-heading"><div><p class="eyebrow">Where we gather</p><h2>Community spaces</h2></div></div>
              <div class="property-list">${properties.map((property) => `
                <div class="property">
                  <div class="property-image">${property.name.slice(0, 1)}</div>
                  <div><h3>${escapeHtml(property.name)}</h3><p>${escapeHtml(property.area)} · ${escapeHtml(property.type)}</p><small>${escapeHtml(property.summary)}</small></div>
                </div>`).join('')}</div>
            </article>
          </section>

          <section class="content-grid">
            <article class="card">
              <div class="section-heading"><div><p class="eyebrow">Play to help</p><h2>Community quests</h2></div><span class="count">${quests.filter((quest) => quest.status === 'open').length} open</span></div>
              <div class="quest-list">${quests.map((quest) => `
                <div class="quest">
                  <div><h3>${escapeHtml(quest.title)}</h3><p>${escapeHtml(quest.description)}</p><small>${escapeHtml(quest.topic)} · ${quest.points} points</small></div>
                  ${quest.status === 'open' ? `<button class="secondary resolve-quest" data-quest-id="${escapeHtml(quest.id)}">Resolve</button>` : '<span class="resolved">Resolved</span>'}
                </div>`).join('')}</div>
            </article>
            <article class="card">
              <div class="section-heading"><div><p class="eyebrow">Knowledge PvP</p><h2>Community leaderboard</h2></div><span class="count">No cash value</span></div>
              <p class="muted">Compete in knowledge challenges about coffee, planet care, and protecting creatures.</p>
              <div class="leaderboard">${knowledgeLeaderboard.map((player, index) => `<div class="activity-row"><span>${index + 1}. ${escapeHtml(player.displayName)}</span><strong>${player.points} score</strong></div>`).join('')}</div>
            </article>
          </section>

          <section class="card gifts">
            <div class="section-heading"><div><p class="eyebrow">Small acts of thanks</p><h2>Coffee gifts</h2></div><button class="secondary" id="send-coffee">Send appreciation</button></div>
            <p class="muted">Coffee gifts are community appreciation messages only. They do not process money or create ownership rights.</p>
            ${coffeeGifts.map((gift) => `<div class="activity-row"><span>${escapeHtml(gift.message)}</span><strong>☕</strong></div>`).join('')}
          </section>

          <section class="card activity">
            <div class="section-heading"><div><p class="eyebrow">Your contribution trail</p><h2>Recent activity</h2></div></div>
            ${progressionEvents.map((event) => `<div class="activity-row"><span>${escapeHtml(event.label)}</span><strong>+${event.points} pts</strong></div>`).join('')}
          </section>
        `;

        document.querySelector('#change-status').addEventListener('click', async () => {
          const status = window.prompt('What are you up to?', member.status);
          if (!status) return;
          await communityFetch(`/api/community/members/${encodeURIComponent(member.id)}/status`, {
            method: 'PATCH',
            headers: authorizedHeaders(true),
            body: JSON.stringify({ status })
          });
          window.location.reload();
        });

        document.querySelector('#invite-neighbor').addEventListener('click', async () => {
          const inviteeName = window.prompt('Who would you like to invite?');
          if (!inviteeName) return;
          await communityFetch('/api/community/referrals', {
            method: 'POST',
            headers: authorizedHeaders(true),
            body: JSON.stringify({ inviteeName })
          });
          window.location.reload();
        });

        document.querySelectorAll('.resolve-quest').forEach((button) => {
          button.addEventListener('click', async () => {
            await communityFetch(`/api/community/quests/${button.dataset.questId}/resolve`, {
              method: 'POST',
              headers: authorizedHeaders(true),
              body: JSON.stringify({})
            });
            window.location.reload();
          });
        });

        document.querySelector('#send-coffee').addEventListener('click', async () => {
          const message = window.prompt('What would you like to thank a neighbor for?');
          if (!message) return;
          await communityFetch('/api/community/coffee-gifts', {
            method: 'POST',
            headers: authorizedHeaders(true),
            body: JSON.stringify({
              recipientId: 'member-2',
              message
            })
          });
          window.location.reload();
        });
      }

      async function loadDashboard() {
        const response = await communityFetch('/api/community/dashboard');
        if (!response.ok) throw new Error('Unable to load dashboard');
        return response.json();
      }

      if (!demoMode) {
        const profile = await passportInstance.getUser().catch(() => null);
        document.querySelector('#passport-login').hidden = Boolean(profile);
        document.querySelector('#passport-logout').hidden = !profile;
        document.querySelector('#auth-status').textContent = profile ? 'Passport authenticated' : 'Signed out';
      }

      loadDashboard()
        .then((response) => {
          return response;
        })
        .then(renderDashboard)
        .catch((error) => {
          document.querySelector('#app').innerHTML =
            `<div class="error">${escapeHtml(error.message)}</div>`;
        });
    </script>
  </body>
</html>
